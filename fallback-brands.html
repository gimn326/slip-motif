<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SLIP 폴백 애니메이션 (실제 브랜드)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 왼쪽 = 실제 비율 키오스크(화면 + 리더), 오른쪽 = 단계 · 설정 · 측정. 키오스크 화면 안은 항상 흑백(제품 그 자체). */
:root{
  --bg:#eceef0; --panel:#ffffff; --ink:#121314; --muted:#5d636b; --line:#cdd2d8; --soft:#f5f6f7;
  --body:#2b2e33; --body-edge:#3a3e44; --slot:#0b0c0d; --card:#d9dcdf; --card-edge:#9aa0a7;
  --f-ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --panel:#1a1d21; --ink:#eef0f2; --muted:#9aa1a9; --line:#30353b; --soft:#202429;
  --body:#2b2e33; --body-edge:#41464d; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111315; --panel:#1a1d21; --ink:#eef0f2; --muted:#9aa1a9; --line:#30353b; --soft:#202429;
  --body:#2b2e33; --body-edge:#41464d; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;opacity:.9;align-items:center;justify-content:center;margin:0 auto 10px;max-width:1100px}
.top .lbl{font-size:11.5px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:4px}
/* 위 막대는 조작용이라 시선을 뺏지 않게: 가는 테두리 · 보통 굵기 · 선택은 옅은 면 */
.top button{font-weight:400;font-size:12.5px;border:1px solid var(--line);color:var(--muted);background:transparent;padding:4px 10px;border-radius:999px}
.top button[aria-pressed=true]{background:var(--soft);color:var(--ink);border-color:var(--muted)}
.top .seg{border:1px solid var(--line);border-radius:999px}
.top .seg button{border:0;border-radius:0;padding:4px 10px;font-size:12.5px}
.top .seg button[aria-pressed=true]{background:var(--soft);color:var(--ink)}
.wrap{position:relative}
.pop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:72px;width:250px;max-height:calc(100vh - 90px);overflow:auto;font-size:13px;padding:12px;background:var(--panel);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:grid;gap:10px;opacity:.96}
@media (max-width:900px){.pop{position:static;width:auto;max-height:none;margin-top:12px}}
.pop details summary{cursor:pointer;font-weight:600;font-size:13px}
h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:700;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:62ch}
.stage{display:flex;justify-content:center;min-width:0}
#kiosk{height:calc(100vh - 96px);min-height:560px;width:auto;max-width:100%;display:block;touch-action:none}
.panel{background:var(--panel);border-radius:14px;padding:18px;display:grid;gap:18px;min-width:0}
.sec-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.steps li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;padding:4px 6px;font-size:12.5px;line-height:1.4;border-radius:8px;color:var(--muted)}
ol.steps li b{font-family:var(--f-mono);font-weight:500;font-size:13px}
ol.steps li .role{display:block;font-size:11px;opacity:.8}
ol.steps li.on{background:var(--ink);color:var(--panel)}
ol.steps li.done{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;border-radius:10px;padding:9px 14px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--ink);color:var(--panel)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--muted);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.grid2 label{font-size:14px}
.grid2 output,.mono{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.grid2 input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ink)}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:13.5px}
.grid2 .seg{grid-column:1/-1;justify-self:start;flex-wrap:wrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.read{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;background:var(--soft);border-radius:10px;padding:10px 12px}
.read span:nth-child(odd){color:var(--muted);font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:0}
.note p{margin:0 0 6px}
</style>

<div class="top">
  <span class="lbl">매장 브랜드</span><div class="chips" id="brandChips"></div>
  <span class="lbl">화면 바탕</span><span class="seg" role="group" aria-label="화면 바탕"><button id="vA" aria-pressed="true">A 흰 → 완료 검정</button><button id="vB" aria-pressed="false">B 검정 → 완료 흰</button></span>
  <span class="lbl">12° 어긋남</span><span class="seg" role="group" aria-label="경계 12도 어긋남"><button data-kink="1" aria-pressed="true">켬 (원본)</button><button data-kink="0" aria-pressed="false">끔</button></span>
  <span class="lbl">MS 방향</span><span class="seg" role="group" aria-label="MS 긁는 방향"><button data-ms="h" aria-pressed="true">가로</button><button data-ms="v" aria-pressed="false">위→아래</button></span>
  <span class="lbl">리더 위치</span><span class="seg" role="group" aria-label="리더 위치"><button data-pos="down" aria-pressed="true">화면 아래</button><button data-pos="right" aria-pressed="false">오른쪽 옆</button><button data-pos="left" aria-pressed="false">왼쪽 옆</button></span>
  <span id="collabWrap" style="display:none;align-items:center;gap:8px"><span class="lbl">브랜드 협업</span><span class="seg" role="group" aria-label="브랜드 협업"><button id="cOff" aria-pressed="true">끄기 (원본)</button><button id="cOn" aria-pressed="false">켜기</button></span></span>
  <button id="reset" style="padding:6px 12px;font-size:13.5px">처음부터</button>
</div>
<p style="text-align:center;font-size:11.5px;color:var(--muted);margin:0 0 6px">학생 과제(기업적스튜디오디자인) 콘셉트 시안입니다. 각 로고와 상표는 해당 회사의 소유이며, 실제 서비스나 제휴와 관계없습니다.</p>
<div class="wrap">
  <div class="stage">
    <svg id="kiosk" viewBox="0 0 1240 2640" role="img" aria-label="키오스크 화면과 카드 리더">
      <defs>
        <clipPath id="screenClip"><rect x="0" y="0" width="1080" height="1920"/></clipPath>
        <clipPath id="slotClipDown"><rect x="0" y="0" width="1240" height="2152"/></clipPath>
        <clipPath id="grooveClip"><rect x="0" y="0" width="1240" height="2468"/></clipPath>
        <!-- 글자 · 로고 뒤 흰 후광: 글자 모양을 넓혀 흐리게 번지게 → 검은 그래픽 위에서도 구분되지만 상자처럼 딱딱하지 않게 -->
        <filter id="halo" x="-20%" y="-60%" width="140%" height="220%">
          <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="d"/>
          <feGaussianBlur in="d" stdDeviation="10" result="b"/>
          <feFlood flood-color="#ffffff" flood-opacity=".9"/>
          <feComposite in2="b" operator="in" result="h"/>
          <feMerge><feMergeNode in="h"/><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
        <!-- 버전 B: 화면 전체 흑백 반전 (#ffffff ↔ #111111 정확히 맞바꿈) -->
        <filter id="inv" filterUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="-1 0 0 0 1.067  0 -1 0 0 1.067  0 0 -1 0 1.067  0 0 0 1 0"/>
        </filter>
        <clipPath id="revealClip"><rect id="revealRect" x="0" y="0" width="0" height="1920"/></clipPath>
      </defs>
      <!-- 본체 -->
      <rect x="0" y="0" width="1240" height="2640" rx="64" fill="var(--body)"/>
      <rect x="6" y="6" width="1228" height="2628" rx="60" fill="none" stroke="var(--body-edge)" stroke-width="4"/>
      <!-- 화면 (항상 흰 바탕 · 검정) -->
      <g id="screen" transform="translate(80 80)">
        <rect width="1080" height="1920" fill="#ffffff"/>
        <g clip-path="url(#screenClip)" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, sans-serif" fill="#111111">
          <!-- 머리: 매장 로고 자리 + 금액 -->
          <g id="hdr">
            <g id="logoSlot"><rect x="80" y="80" width="300" height="110" fill="none" stroke="#111" stroke-width="3" stroke-dasharray="12 10"/>
            <text x="230" y="148" font-size="32" text-anchor="middle">매장 로고</text></g>
            <g id="amt"><text x="80" y="330" font-size="32">결제 금액</text><text x="1000" y="330" font-size="44" font-weight="700" text-anchor="end">12,500원</text></g>
          </g>
          <g id="txt"></g>
          <g id="doneT" clip-path="url(#revealClip)" style="display:none">
            <text id="doneTitle" x="672" y="1012" font-size="96" font-weight="700" text-anchor="end" fill="#fff">승인되었습니다</text>
            <path id="doneArc" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
            <text x="80" y="1180" font-size="40" fill="#fff">주문번호 128</text>
            <text x="80" y="1244" font-size="40" fill="#fff">카드를 가져가세요.</text>
          </g>
          <g id="btns"></g>
          <!-- 그래픽 -->
          <path id="cornerArc" fill="none" stroke="#111" stroke-linecap="round"/>
          <circle id="cornerDot" fill="#111"/>
          <path id="heroArc" fill="none" stroke="#111" stroke-linecap="round"/>
          <circle id="heroDot" fill="#111"/>
          <line id="swipeLine" stroke="#111" stroke-linecap="round"/>
          <g id="guide"><circle id="gDot" r="12" fill="#111"/><line id="gLine" stroke="#111" stroke-width="6"/></g>
          <g id="cardGhost" opacity="0">
            <rect id="cgBody" rx="28" fill="rgba(17,17,17,.06)" stroke="#111" stroke-width="6"/>
            <rect id="cgChip" rx="10" fill="none" stroke="#111" stroke-width="5"/>
            <polygon id="cgPoly" fill="rgba(17,17,17,.06)" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
            <polygon id="cgChipPoly" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
          </g>
          <g id="collab"></g>
          <circle id="flood" fill="#111" r="0"/>
          <circle id="period" fill="#fff" r="0"/>
          <g id="slotLabel"><line id="slotLine" x1="340" y1="1830" x2="740" y2="1830" stroke="#111" stroke-width="8"/><text id="slotText" x="540" y="1790" font-size="32" text-anchor="middle">카드 투입구</text></g>
        </g>
      </g>
      <!-- 매장 브랜드 층: 화면 반전(B)과 승인 면 전환에 영향받지 않음, SLIP 그래픽보다 앞 = 매장 브랜드를 가리지 않음 -->
      <g id="brandLayer" transform="translate(80 80)" clip-path="url(#screenClip)" font-family="IBM Plex Sans KR, Apple SD Gothic Neo, sans-serif">
        <g id="brandLogo"></g><g id="brandBtns"></g>
      </g>
      <!-- 리더: IC 투입구 + MS 홈 (화면과 같은 축척: 1 mm = 4.03) -->
      <g id="reader">
        <!-- IC 투입구: 화면 아래 / 옆 모듈. 어느 위치든 투입구는 정면(보는 사람 쪽)으로 뚫려 있고, 카드는 내 쪽에서 안쪽으로 들어감 -->
        <g id="slotDown"><text x="620" y="2090" font-size="30" fill="#aab0b7" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif">IC 투입구</text>
        <rect x="499" y="2140" width="242" height="18" rx="9" fill="var(--slot)"/></g>
        <g id="podR" style="display:none"><rect x="1250" y="1540" width="340" height="560" rx="44" fill="var(--body)" stroke="var(--body-edge)" stroke-width="4"/>
        <text x="1420" y="1700" font-size="30" fill="#aab0b7" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif">IC 투입구</text>
        <rect x="1299" y="1791" width="242" height="18" rx="9" fill="var(--slot)"/></g>
        <g id="podL" style="display:none"><rect x="-350" y="1540" width="340" height="560" rx="44" fill="var(--body)" stroke="var(--body-edge)" stroke-width="4"/>
        <text x="-180" y="1700" font-size="30" fill="#aab0b7" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif">IC 투입구</text>
        <rect x="-301" y="1791" width="242" height="18" rx="9" fill="var(--slot)"/></g>
        <g id="msHg"><text x="620" y="2400" font-size="30" fill="#aab0b7" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif">MS 홈 — 카드를 잡고 오른쪽으로 끌어 긁기</text>
        <rect x="200" y="2452" width="840" height="34" rx="12" fill="var(--slot)"/>
        <line x1="620" y1="2440" x2="620" y2="2500" stroke="#6d737a" stroke-width="6"/>
        <text x="620" y="2540" font-size="24" fill="#8a9097" text-anchor="middle" font-family="IBM Plex Mono, monospace">읽기 헤드</text></g>
        <!-- 세로 MS 모듈(오른쪽): 위에서 아래로 긁음 -->
        <g id="msVg" style="display:none"><rect x="1250" y="290" width="340" height="1090" rx="44" fill="var(--body)" stroke="var(--body-edge)" stroke-width="4"/>
        <text x="1420" y="350" font-size="30" fill="#aab0b7" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif">MS 홈 ↓</text>
        <rect x="1403" y="390" width="34" height="860" rx="12" fill="var(--slot)"/>
        <line x1="1388" y1="820" x2="1452" y2="820" stroke="#6d737a" stroke-width="6"/>
        <text x="1300" y="828" font-size="22" fill="#8a9097" text-anchor="middle" font-family="IBM Plex Mono, monospace">헤드</text></g>
        <!-- 실물 카드 -->
        <g id="pcardMS" clip-path="url(#grooveClip)" style="cursor:grab"><g id="pcardMSg">
          <rect x="0" y="0" width="345" height="218" rx="22" fill="var(--card)" stroke="var(--card-edge)" stroke-width="4"/>
          <rect x="0" y="150" width="345" height="40" fill="#3b3f45"/>
        </g></g>
        <!-- 정면 투입구: 보는 사람 쪽으로 튀어나온 카드(원근) -->
        <g id="pcardFront" style="cursor:grab">
          <polygon id="pfPoly" fill="var(--card)" stroke="var(--card-edge)" stroke-width="4" stroke-linejoin="round"/>
          <polygon id="pfChip" fill="#c7a64a"/>
        </g>
        <!-- 긁기 손잡이: 홈 주변 어디를 잡아도 카드가 손을 따라감 -->
        <text id="coach" x="620" y="2612" font-size="34" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif"></text>
        <rect id="msHit" x="0" y="2270" width="1240" height="370" fill="transparent" style="cursor:grab;display:none"/>
      </g>
    </svg>
  </div>

  <aside class="pop" aria-label="단계">
    <ol class="steps" id="steps"></ol>
    <p class="hint" id="hint" style="margin:0"></p>
    <div class="read" aria-live="polite">
      <span>IC 시도</span><span id="rTry" class="mono">0</span>
      <span>긁기 속도</span><span id="rSpeed" class="mono">—</span>
      <span>더한 결제 시간</span><span class="mono">0초</span>
      <span hidden>지금</span><span hidden id="rNow"></span>
    </div>
    <p class="note"><b>로고 처리</b> · <span id="rLogo">—</span></p>
    <p class="note"><b>브랜드 협업</b> · <span id="rCollab">—</span></p>
    <details><summary>설정</summary>
      <div class="grid2" style="margin-top:8px">
        <label for="sp">자동 긁기 속도</label><output id="spO" class="mono"></output>
        <input id="sp" type="range" min="3" max="60" step="1" value="20">
        <label for="icT">IC 읽기 시간</label><output id="icTO" class="mono"></output>
        <input id="icT" type="range" min="0.5" max="4" step="0.1" value="2">
        <label for="apT">승인 대기 시간</label><output id="apTO" class="mono"></output>
        <input id="apT" type="range" min="0.3" max="4" step="0.1" value="1.5">
        <label for="tries">폴백 전 IC 시도</label><output id="triesO" class="mono"></output>
        <input id="tries" type="range" min="1" max="3" step="1" value="2">
        <label>실패 화면</label>
        <span class="seg" role="group" aria-label="실패 화면"><button id="fNew" aria-pressed="true">새 안</button><button id="fOld" aria-pressed="false">원안 (그래픽 없음)</button></span>
        <label>결과</label>
        <span class="seg" role="group" aria-label="결과"><button id="okB" aria-pressed="true">승인</button><button id="noB" aria-pressed="false">거절</button></span>
      </div>
      <p class="note" style="margin-top:8px">긁기 속도 3–60 in/s = MS 리더 데이터시트 범위. 기본 20 in/s · 화면 폭 268 mm는 추정.</p>
    </details>
  </aside>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const U=1080/268;                // 화면 단위 / mm
const CARD_L=85.6*U, CARD_W=54*U; // 345 × 218
const HEAD_X=620, GROOVE_X0=200, GROOVE_X1=1040, GROOVE_Y=2452;
const AX=900, AY=1000, AR=340, ASW=56;     // 주연 호 (K6). 중심을 오른쪽에 둬서 긁기가 끝난 선이 늘 중심 앞에 있게
const EYE={x:600,y:1060,r:200,sw:40,dr:40}; // 눈 상태
// 읽는 중: C3 Macro처럼 크게 — 중심(점)은 화면 오른쪽 위 밖, 점은 가장자리에 아랫부분만. 호는 반지름 1100으로 화면 밖까지 크게 돌며 들어왔다 나감
const MAC={x:1000,y:-200,r:1100,sw:260,dr:260};
const CORNER={x:976,y:135,r:16,sw:4,dr:4};
const STEPS=[
 ['select','결제 방법 선택','가만히'],
 ['prompt','카드 넣기 안내','점이 투입구를 봄'],
 ['insert','카드 넣는 순간','투명 카드가 넣는 방향으로'],

function projQuad(vx,vy,A,B,zNear,zFar,u0=-1,u1=1){return [[u0,zNear],[u1,zNear],[u1,zFar],[u0,zFar]].map(([u,z])=>`${vx+u*B/z},${vy+A/z}`).join(' ')}
function frontQuads(vx,vy,A,B,e){const tip=1+LZ*e,near=tip-LZ;if(near>=.999)return null;
  const body=projQuad(vx,vy,A,B,near,1);const c0=Math.max(near,tip-LZ*.32),c1=Math.min(1,tip-LZ*.14);
  const chip=c1>c0?projQuad(vx,vy,A,B,c0,c1,-.62,-.18):'';return {body,chip}}

let collabOn=false;
const fmt=n=>Math.round(n*10)/10;
function tear(x0,x1,yc,h,hx,gap){ // 띠(테이프 · 봉투 접힘 · 칼집)를 hx까지 찢음 → 위 · 아래 조각 + 아직 안 찢긴 부분
  const e=Math.min(hx,x1),xs=[];for(let x=x0;x<e;x+=14)xs.push(x);xs.push(e);
  const g=x=>gap*Math.min(1,Math.max(0,(hx-x)/90)),z=i=>(i%2?6:-6);
  let up='',lo='';
  if(e>x0+4){
    const top=xs.map(x=>`${fmt(x)},${fmt(yc-h/2-g(x))}`),bot=xs.map((x,i)=>`${fmt(x)},${fmt(yc-g(x)+z(i))}`).reverse();
    const ltop=xs.map((x,i)=>`${fmt(x)},${fmt(yc+g(x)+z(i))}`),lbot=xs.map(x=>`${fmt(x)},${fmt(yc+h/2+g(x))}`).reverse();
    up=top.concat(bot).join(' ');lo=ltop.concat(lbot).join(' ');}
  return {up,lo,ix:Math.max(x0,e),iw:Math.max(0,x1-Math.max(x0,e))};
}
function runner(x,y,ph,c){ // 달리는 사람: 위상 ph는 '간 거리'에서 나옴 → 긁는 속도가 빠르면 다리도 빨라짐
  const L=(a,l,ox,oy)=>[ox+l*Math.sin(a),oy+l*Math.cos(a)];
  const hip=[x,y-120],sh=[x+34,y-235],hd=[x+52,y-282];
  const s1=Math.sin(ph),s2=Math.sin(ph+Math.PI);
  const k1=L(.7*s1,70,hip[0],hip[1]),f1=L(.7*s1-(.9+.6*Math.max(0,-s1)),70,k1[0],k1[1]);
  const k2=L(.7*s2,70,hip[0],hip[1]),f2=L(.7*s2-(.9+.6*Math.max(0,-s2)),70,k2[0],k2[1]);
  const e1=L(-.9*s1+.3,55,sh[0],sh[1]),h1=L(-.9*s1+1.6,50,e1[0],e1[1]);
  const e2=L(-.9*s2+.3,55,sh[0],sh[1]),h2=L(-.9*s2+1.6,50,e2[0],e2[1]);
  const P_=a=>a.map(fmt).join(',');
  return `<g fill="none" stroke="${c}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="${P_(hip)} ${P_(sh)}"/><polyline points="${P_(hip)} ${P_(k1)} ${P_(f1)}"/><polyline points="${P_(hip)} ${P_(k2)} ${P_(f2)}"/>
    <polyline points="${P_(sh)} ${P_(e1)} ${P_(h1)}"/><polyline points="${P_(sh)} ${P_(e2)} ${P_(h2)}"/></g><circle cx="${fmt(hd[0])}" cy="${fmt(hd[1])}" r="30" fill="${c}"/>`;
}

    <ellipse cx="${CX}" cy="${R+HT}" rx="${BW}" ry="10" fill="#000" opacity=".08"/>`;
  const drink=`<ellipse cx="${CX}" cy="${R}" rx="${TW-6}" ry="24" fill="${o.drink||'#4a3324'}"/>`;
  const lid=(dy,rot)=>`<g transform="translate(0 ${F(dy)}) rotate(${F(rot)} ${CX} ${R})">
    <rect x="${CX-TW-14}" y="${R-22}" width="${2*TW+28}" height="30" rx="12" fill="#ffffff"/>
    <rect x="${CX-TW-14}" y="${R-2}" width="${2*TW+28}" height="10" rx="5" fill="#d9d9d9"/>

    <rect x="${CX+50}" y="${R-38}" width="60" height="16" rx="8" fill="#2b2b2b"/></g>`;
  if(c.dir==='v'){ // 위→아래 긁기 = 빨대 꽂기: 뚜껑은 닫혀 있고, 빨대가 내려와 구멍(점 자리)으로 들어감
    const HY=R-30,tip=HY-700+700*E3(c.p),len=560,tilt=12*c.bump;
    return `${body}${lid(0,0)}<clipPath id="strawClip"><rect x="0" y="0" width="1080" height="${HY}"/></clipPath>
      <g clip-path="url(#strawClip)" transform="rotate(${F(tilt)} ${HX} ${F(tip)})"><rect x="${HX-15}" y="${F(tip-len)}" width="30" height="${len}" rx="6" fill="${o.straw||'#2b2b2b'}"/>
      ${o.stripe?[0,1,2,3,4,5].map(i=>`<rect x="${HX-15}" y="${F(tip-len+40+i*80)}" width="30" height="26" fill="${o.stripe}"/>`).join(''):''}</g>`;

  const k=E3(c.p),dy=-360*(1-k)+(c.p>.97?3:0),rot=-14*(1-k)+12*c.bump;

    if(t>=1.45){st.retry=true;go('prompt')} // 깜빡 뒤 0.3초만 쉼 → 바로 다시 안내(빠르게 내려감)
  }
  if(s==='miss'&&st.missKind==='ms'){
    // 호는 그대로(주연 유지) 가늘어지고, 긁은 선은 그 자리에 가는 흔적으로 → 점이 선의 시작점에 와서 박동
    hero={x:AX,y:AY,r:AR,sw:ASW*.4};
    const sx=60;const k=ease(clamp(t/.6,0,1)),beat=t>.6?Math.pow(Math.max(0,Math.sin((t-.6)*Math.PI/1.2)),6):0;
    hDot={...VP(lerp(AX,sx,k),AY),r:lerp(6,16,k)*(1+.15*beat)};
  }
  if(s==='reject'&&st.failNew){
    // 반전 없음. 확인의 점을 거두고(크기 0), 큰 호는 모서리 조연으로 물러남 — 마침표가 없다 = 끝나지 않았다
    corner=t>.5?CORNER:null;cDot=0;hero=t<.5?{x:CORNER.x,y:CORNER.y,r:CORNER.r,sw:CORNER.sw}:null;hDot=null;
  }
  if(s==='done'){ // 호는 사라지고, 점 자리에서 글자가 왼쪽으로 펼쳐지며 점은 마침표로 줄어듦
    hero=null;
    // 면 전환: 점이 화면 전체를 덮는 검은 면으로 번짐 → 흑백 반전. 가운데 흰 점이 남아 마침표가 되고, 그 자리에서 흰 글자가 펼쳐짐
    const fl=clamp(t/.6,0,1),fe=fl<1?1-Math.pow(1-fl,3):1;setDot('flood',FX(),FY(),lerp(ASW/2,2400,fe));
    const r=ease(clamp((t-.2)/.45,0,1));setDot('period',FX(),FY(),lerp(0,12,r));
    const rv=ease(clamp((t-.3)/.6,0,1)),rx=lerp(FX(),0,rv);const R=$('revealRect');R.setAttribute('x',rx);R.setAttribute('width',FX()+20-rx);
    if(rv>=1){R.setAttribute('x',0);R.setAttribute('width',1080)}
  }
  if(s==='swipe'||s==='auth'||(s==='miss'&&st.missKind==='ms'))hero=VA(hero);
  const cOn=drawCollab(s,t);if(cOn&&(s==='swipe'||s==='auth'||s==='miss')){hero=null}
  // 매장 이름 글자색: 바탕이 어두우면 흰색 (B 바탕, A의 승인 검정 면) — 로고 표식과 영문은 매장 색 그대로
  if(brand)refreshLogo(false);
  // 적용 — 목표값을 부드럽게 따라감. 사라질 때는 그 자리에서 굵기 · 크기만 0으로.
  const K_=s==='read'?9:12; // 낮을수록 천천히 부드럽게 따라감
  const ct=corner?{x:corner.x,y:corner.y,r:corner.r,sw:corner.sw}:(disp.corner?{...disp.corner,sw:0}:null);
  if(ct){disp.corner=follow(disp.corner||{...ct,sw:0},ct,K_,dt)}disp.cdot=lerp(disp.cdot,corner?cDot:0,1-Math.exp(-K_*dt));
  const ht=hero?{x:hero.x,y:hero.y,r:hero.r,sw:hero.sw,a0:hero.a0??125,a1:hero.a1??235}:(disp.hero?{...disp.hero,sw:0}:null);
  if(ht){if(disp.hero&&Math.abs(disp.hero.a0-ht.a0)>400){disp.hero.a0=ht.a0;disp.hero.a1=ht.a1}disp.hero=follow(disp.hero||{...ht,sw:0},ht,K_,dt)}
  const exact=s==='fail'||s==='insert'||(s==='prompt'&&(st.retry?t+1.3:t)>1.3); // 길잡이 점은 실제 긁기 속도 그대로
  const dtg=hDot?{x:hDot.x,y:hDot.y,r:hDot.r}:(disp.dot?{...disp.dot,r:0}:null);
  if(dtg)disp.dot=exact?{...dtg}:follow(disp.dot||{...dtg,r:0},dtg,K_+4,dt);
  const C_=disp.corner;setArc('cornerArc',C_&&C_.sw>.3?C_:null);setDot('cornerDot',C_?C_.x:0,C_?C_.y:0,disp.cdot);
  setArc('heroArc',disp.hero&&disp.hero.sw>.3?disp.hero:null);setDot('heroDot',disp.dot?disp.dot.x:0,disp.dot?disp.dot.y:0,disp.dot?disp.dot.r:0);
  // 후광: 그래픽보다 조금 넓은 반투명 흰 띠 (흐림 필터는 매 프레임 비싸서 뺌)
  const H_=disp.hero&&disp.hero.sw>.3?{...disp.hero,sw:disp.hero.sw+32}:null;setArc('heroHalo',H_);
  setDot('dotHalo',disp.dot?disp.dot.x:0,disp.dot?disp.dot.y:0,disp.dot&&disp.dot.r>.5?disp.dot.r+16:0);
  if(cOn&&s==='miss'){$('swipeLine').setAttribute('stroke-width',0);$('lineHalo').setAttribute('stroke-width',0)}
  else if(s==='miss'&&st.missKind==='ms'&&st.missLine){const L=$('swipeLine'),k=clamp(t/.4,0,1),ml=VL(st.missLine);for(const [a_,v_] of [['x1',ml.x1],['y1',ml.y1],['x2',ml.x2],['y2',ml.y2]])L.setAttribute(a_,v_);L.setAttribute('stroke-width',lerp(ASW,8,ease(k)));$('lineHalo').setAttribute('stroke-width',0)}
  else if(s==='reject'&&st.failNew&&st.line){const L=$('swipeLine');L.setAttribute('stroke-width',lerp(ASW,0,ease(clamp(t/.4,0,1))))}
  else{const L=$('swipeLine'),LH=$('lineHalo');if((s==='swipe'||s==='auth')&&st.line&&!cOn){const ml=VL(st.line);for(const el of [L,LH]){el.setAttribute('x1',ml.x1);el.setAttribute('y1',ml.y1);el.setAttribute('x2',ml.x2);el.setAttribute('y2',ml.y2)}L.setAttribute('stroke-width',ASW);LH.setAttribute('stroke-width',ASW+32)}else{L.setAttribute('stroke-width',0);LH.setAttribute('stroke-width',0)}}
  const G=$('cardGhost');const isFront=!!(ghost&&'front' in ghost);
  $('cgBody').style.display=$('cgChip').style.display=isFront?'none':'';$('cgPoly').style.display=$('cgChipPoly').style.display=isFront?'':'none';
  if(isFront){G.setAttribute('opacity',ghost.front?1:0);if(ghost.front){$('cgPoly').setAttribute('points',ghost.front.body);$('cgChipPoly').setAttribute('points',ghost.front.chip||'0,0')}}
  else if(ghost){G.setAttribute('opacity',ghost.o);const b=$('cgBody'),c=$('cgChip');b.setAttribute('x',ghost.x);b.setAttribute('y',ghost.y);b.setAttribute('width',ghost.w);b.setAttribute('height',ghost.h);
    const sc=ghost.sc||1;if(ghost.chip==='bottom'){c.setAttribute('width',50*sc);c.setAttribute('height',40*sc);c.setAttribute('x',ghost.x+ghost.w/2-25*sc);c.setAttribute('y',ghost.y+ghost.h-80*sc)}else{c.setAttribute('width',40);c.setAttribute('height',50);c.setAttribute('x',ghost.x+ghost.w-80);c.setAttribute('y',ghost.y+ghost.h/2-25)}}
  else G.setAttribute('opacity',0);
  // 자동 재생
  if(st.auto){
    if(s==='select'&&t>.8)start();
    else if(s==='prompt'&&t>(st.retry?1.2:1.4))insert();
    else if((s==='fail'||(s==='miss'&&st.missKind==='ms'))&&t>1.4)autoSwipe();
    else if((s==='done'||s==='reject')&&t>2.6)go('select');
  }
  requestAnimationFrame(frame);
}

try{if(localStorage.getItem('slipVer')==='B')setVer('B');const sp_=localStorage.getItem('slipPos');if(POS[sp_]){st.pos=sp_;document.querySelectorAll('[data-pos]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pos===sp_))}}catch(e){}
// 주소 뒤 #pos=right&ver=B&brand=navy&step=prompt 로 바로 열기 (비교 · 캡처용)
try{const h=new URLSearchParams(location.hash.slice(1));if(POS[h.get('pos')]){st.pos=h.get('pos');document.querySelectorAll('[data-pos]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pos===st.pos))}
  if(h.get('ver')==='B')setVer('B');if(BRANDS[h.get('brand')]){brand=h.get('brand');chips();refreshLogo(true)}if(h.get('collab')==='1')collabOn=true;if(h.get('kink')==='0'){st.kink=0;document.querySelectorAll('[data-kink]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.kink==='0'))}if(h.get('ms')==='v'){st.msV=true;document.querySelectorAll('[data-ms]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.ms==='v'))}var hStep=h.get('step'),hP=h}catch(e){}
syncCollabUI();
layoutSlot();go('select');if(hStep&&hStep!=='select'){if(hStep==='insert'){go('prompt');st.insP=.5;st.manual=true;go('insert')}else go(hStep);if(hStep==='swipe'){placeMS(GROOVE_X0-CARD_L+30+(+hP.get('demo')||.6)*840);st.v=+sp.value*25.4*U}}requestAnimationFrame(frame);
if(reduce)$('hint').textContent+=' (모션 줄이기 설정이 켜져 있어 자동 재생은 직접 눌러야 시작합니다.)';
})();
</script>
